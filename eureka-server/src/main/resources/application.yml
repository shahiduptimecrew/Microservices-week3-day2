server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: localhost
  client:
    # A standalone registry does not register with / fetch from itself.
    register-with-eureka: false
    fetch-registry: false
  server:
    # Demo setting: evict dead instances quickly so the dashboard reflects reality.
    # Self-preservation protects against network partitions in production - keep it ON there.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
