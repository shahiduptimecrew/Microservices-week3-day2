server:
  port: 8081
  # Behind the API Gateway, build Location headers from X-Forwarded-* (gateway host/port),
  # not from this instance's own host:port.
  forward-headers-strategy: framework

spring:
  application:
    name: product-service
  data:
    web:
      pageable:
        # Protects the service from ?size=1000000
        max-page-size: 100
  datasource:
    # Each service owns its OWN database. No other service connects to it.
    url: jdbc:h2:mem:productdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    # Unique id per instance, so two Product Service instances (8081, 8084) both appear.
    instance-id: ${spring.application.name}:${server.port}
    # Demo values: faster heartbeats so registration/eviction is visible within seconds.
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    version: openapi_3_1
  swagger-ui:
    # Drop-down in Swagger UI: the hand-written contract and the one generated from code.
    urls:
      - name: spec-first (product-api.yaml)
        url: /openapi/product-api.yaml
      - name: generated from code
        url: /v3/api-docs
    urls-primary-name: spec-first (product-api.yaml)
